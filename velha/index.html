<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16213e">
<title>⭕ Jogo da Velha · DuduGames</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../shared.css">
<style>
  * { box-sizing: border-box; }
  body { min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .ttt-board { display: grid; grid-template-columns: repeat(3, 96px); gap: 8px; padding: 12px; width: fit-content; }
  .ttt-cell { width: 96px; height: 96px; font-size: 42px; }
  @media (max-width: 380px) { .ttt-board { grid-template-columns: repeat(3, 82px); } .ttt-cell { width: 82px; height: 82px; } }
</style>
</head>
<body>
<div class="game-wrap">
  <a class="back" href="../">← DuduGames</a>
  <h1 class="game-title">⭕ Jogo da Velha</h1>
  <div class="by">by DuduGames</div>
  <div class="game-hud"><span>Vitórias: <b id="wins">0</b></span><span>Recorde: <b id="best">0</b></span></div>
  <div id="board" class="game-board ttt-board"></div>
  <div class="game-actions"><button class="btn" id="restart">🔄 Reiniciar</button></div>
  <p class="game-message" id="msg">Você é X. Faça três em linha.</p>
</div>
<script src="../shared.js"></script>
<script>
(() => {
  const dg = DuduGames;
  const board = document.getElementById('board');
  const msg = document.getElementById('msg');
  const winsEl = document.getElementById('wins');
  const bestEl = document.getElementById('best');
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let cells, turn, over, streak = 0, best = dg.getRecord('velha');
  bestEl.textContent = best;
  dg.installControls();
  function reset() {
    cells = Array(9).fill(''); turn = 'X'; over = false; board.innerHTML = ''; msg.textContent = 'Você é X. Faça três em linha.';
    for (let i = 0; i < 9; i++) {
      const b = document.createElement('button');
      b.className = 'game-cell ttt-cell'; b.type = 'button';
      b.addEventListener('click', () => play(i)); board.appendChild(b);
    }
  }
  function winner() {
    for (const line of wins) if (cells[line[0]] && line.every(i => cells[i] === cells[line[0]])) return cells[line[0]];
    return cells.every(Boolean) ? 'draw' : '';
  }
  function play(i) {
    if (over || cells[i]) return;
    dg.markPlayed('velha'); cells[i] = 'X'; board.children[i].textContent = 'X'; dg.sound('tick');
    let w = winner(); if (w) return finish(w);
    setTimeout(ai, 180);
  }
  function ai() {
    if (over) return;
    const empty = cells.map((v,i) => v ? -1 : i).filter(i => i >= 0);
    const pick = bestMove(empty, 'O') ?? bestMove(empty, 'X') ?? (cells[4] ? empty[Math.floor(Math.random()*empty.length)] : 4);
    cells[pick] = 'O'; board.children[pick].textContent = 'O';
    const w = winner(); if (w) finish(w); else msg.textContent = 'Sua vez.';
  }
  function bestMove(empty, mark) {
    for (const i of empty) { cells[i] = mark; const ok = winner() === mark; cells[i] = ''; if (ok) return i; }
    return null;
  }
  function finish(w) {
    over = true;
    if (w === 'X') {
      streak++; winsEl.textContent = streak; dg.unlock('velha-win'); dg.sound('win'); msg.textContent = 'Você venceu!';
      if (dg.setRecord('velha', streak)) { best = streak; bestEl.textContent = best; }
    } else if (w === 'O') { streak = 0; winsEl.textContent = '0'; dg.sound('fail'); msg.textContent = 'O computador venceu.'; }
    else { msg.textContent = 'Empate.'; dg.sound('tick'); }
  }
  document.getElementById('restart').addEventListener('click', reset);
  window.addEventListener('dudu-reset', () => { best = 0; streak = 0; bestEl.textContent = '0'; winsEl.textContent = '0'; });
  reset();
})();
</script>
</body>
</html>
