<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16213e">
<title>👾 Space Invaders · DuduGames</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../shared.css">
<style>
  * { box-sizing: border-box; }
  body { min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  canvas { max-width: 100%; aspect-ratio: 5 / 4; }
  .touch { display: flex; justify-content: center; gap: 8px; }
  .touch button { min-width: 58px; }
</style>
</head>
<body>
<div class="game-wrap wide">
  <a class="back" href="../">← DuduGames</a>
  <h1 class="game-title">👾 Space Invaders</h1>
  <div class="by">by DuduGames</div>
  <div class="game-hud"><span>Pontos: <b id="score">0</b></span><span>Recorde: <b id="best">0</b></span></div>
  <canvas id="game" class="game-canvas game-board" width="600" height="480"></canvas>
  <div class="game-actions"><button class="btn" id="restart">🔄 Reiniciar</button></div>
  <div class="touch"><button class="btn" data-key="left">←</button><button class="btn" data-key="fire">•</button><button class="btn" data-key="right">→</button></div>
  <p class="game-message">← → movem · Espaço atira</p>
</div>
<script src="../shared.js"></script>
<script>
(() => {
  const dg = DuduGames, cv = document.getElementById('game'), ctx = cv.getContext('2d'), scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  const speeds = { easy: .55, normal: .8, hard: 1.1 };
  let player, shots, inv, dir, score, best = dg.getRecord('invaders'), keys = {}, over = false, lastShot = 0;
  bestEl.textContent = best; dg.installControls({ difficulty: true, onDifficultyChange: reset });
  function reset() {
    player = { x: 280, y: 435, w: 42, h: 18 }; shots = []; inv = []; dir = 1; score = 0; over = false; scoreEl.textContent = '0'; dg.markPlayed('invaders');
    for (let y = 0; y < 4; y++) for (let x = 0; x < 8; x++) inv.push({ x: 70 + x*54, y: 50 + y*38, alive: true });
  }
  function fire() { const now = Date.now(); if (now - lastShot < 220) return; lastShot = now; shots.push({ x: player.x + player.w/2, y: player.y }); dg.sound('tick'); }
  function update() {
    if (!over) {
      const speed = speeds[dg.getDifficulty()] || speeds.normal;
      if (keys.left) player.x -= 5; if (keys.right) player.x += 5; if (keys.fire) fire();
      player.x = Math.max(0, Math.min(cv.width - player.w, player.x)); shots.forEach(s => s.y -= 7); shots = shots.filter(s => s.y > -10);
      let edge = false; inv.forEach(i => { if (!i.alive) return; i.x += dir * speed; if (i.x < 18 || i.x > 552) edge = true; });
      if (edge) { dir *= -1; inv.forEach(i => i.y += 16); }
      for (const s of shots) for (const i of inv) if (i.alive && s.x > i.x && s.x < i.x+28 && s.y > i.y && s.y < i.y+22) {
        i.alive = false; s.y = -99; score += 10; scoreEl.textContent = score; dg.sound('score'); if (score >= 100) dg.unlock('invaders-100'); if (dg.setRecord('invaders', score)) { best = score; bestEl.textContent = best; }
      }
      if (inv.every(i => !i.alive)) reset();
      if (inv.some(i => i.alive && i.y > 390)) { over = true; dg.sound('fail'); }
    }
  }
  function draw() {
    ctx.fillStyle = '#0d1526'; ctx.fillRect(0,0,600,480); ctx.fillStyle = '#4ade80'; ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.fillStyle = '#e6edf3'; shots.forEach(s => ctx.fillRect(s.x-2, s.y, 4, 12));
    inv.forEach(i => { if (!i.alive) return; ctx.fillStyle = '#22d3ee'; ctx.fillRect(i.x, i.y, 28, 18); ctx.fillStyle = '#0d1526'; ctx.fillRect(i.x+6, i.y+6, 4, 4); ctx.fillRect(i.x+18, i.y+6, 4, 4); });
    if (over) { ctx.fillStyle = 'rgba(0,0,0,.62)'; ctx.fillRect(0,190,600,100); ctx.fillStyle = '#e6edf3'; ctx.font = '700 30px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Base invadida',300,250); }
  }
  function loop() { update(); draw(); requestAnimationFrame(loop); }
  document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') keys.left = true; if (e.key === 'ArrowRight') keys.right = true; if (e.key === ' ') { keys.fire = true; e.preventDefault(); } });
  document.addEventListener('keyup', e => { if (e.key === 'ArrowLeft') keys.left = false; if (e.key === 'ArrowRight') keys.right = false; if (e.key === ' ') keys.fire = false; });
  document.querySelectorAll('[data-key]').forEach(b => { const k = b.dataset.key; b.addEventListener('pointerdown', () => keys[k] = true); b.addEventListener('pointerup', () => keys[k] = false); b.addEventListener('pointerleave', () => keys[k] = false); });
  document.getElementById('restart').addEventListener('click', reset);
  window.addEventListener('dudu-reset', () => { best = 0; bestEl.textContent = '0'; });
  reset(); loop();
})();
</script>
</body>
</html>
